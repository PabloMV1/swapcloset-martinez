services:
  db:
    image: postgres:16
    container_name: swapcloset-db
    environment:
      POSTGRES_DB: swapcloset
      POSTGRES_USER: swapcloset
      POSTGRES_PASSWORD: ${DB_PASSWORD:-swapcloset}
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U swapcloset -d swapcloset"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
